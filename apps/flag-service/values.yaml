name: flag-service

replicaCount: 2

image:
  repository: 581571885952.dkr.ecr.us-east-1.amazonaws.com/toggle-master/flag-service
  tag: 1.0.0-79f65c3
  pullPolicy: IfNotPresent


service:
  port: 8002

configMap:
  name: flag-service-config

env:
  databaseUrl: "postgresql://teste:12345667@dev-flag-service-database.cahgwak00ah1.us-east-1.rds.amazonaws.com:5432/flag_db?sslmode=require"
  port: "8002"
  authServiceUrl: "http://auth-service:8001"

probes:
  path: /health

  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
