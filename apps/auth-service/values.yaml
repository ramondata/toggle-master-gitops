replicaCount: 2

image:
  repository: 581571885952.dkr.ecr.us-east-1.amazonaws.com/toggle-master/auth-service
  tag: v1.0.0-4e6fc75
  pullPolicy: IfNotPresent

service:
  port: 8001

secret:
  name: auth-service-secrets

probes:
  path: /health

  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi