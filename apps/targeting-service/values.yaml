name: targeting-service

namespace: toggle-master

replicaCount: 2

image:
  repository: 570763223269.dkr.ecr.us-east-1.amazonaws.com/toggle-master/targeting-service
  tag: v1.0.0-5fb9f17
  pullPolicy: IfNotPresent

service:
  port: 8003

configMap:
  name: targeting-service-config

env:
  databaseUrl: "postgresql://teste:123456678@dev-target-service-database.cahgwak00ah1.us-east-1.rds.amazonaws.com:5432/target_db"
  port: "8003"
  authServiceUrl: "http://auth-service:8001"

livenessProbe:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 250m
    memory: 256Mi